<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">How Codex Skills Library turns a task into an inspectable result</title>
  <desc id="desc">A four-step workflow from a task, through a focused skill and Codex checkpoints, to an inspectable output. The library contains nine research and paper skills, four app and user interface skills, two general methods, and two GitHub or Codex operations skills.</desc>
  <style>
    .canvas { fill: #f6f8fa; }
    .surface { fill: #ffffff; }
    .soft { fill: #eef2f6; }
    .border { fill: none; stroke: #d0d7de; }
    .divider { stroke: #d8dee4; }
    .text { fill: #1f2328; }
    .muted { fill: #59636e; }
    .blue { fill: #0969da; }
    .blue-soft { fill: #ddf4ff; }
    .green { fill: #1a7f37; }
    .green-soft { fill: #dafbe1; }
    .amber { fill: #9a6700; }
    .amber-soft { fill: #fff8c5; }
    .purple { fill: #8250df; }
    .purple-soft { fill: #fbefff; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 15px; font-weight: 700; }
    .title { font-size: 23px; font-weight: 700; }
    .group-title { font-size: 21px; font-weight: 700; }
    .body { font-size: 16px; font-weight: 500; }
    .small { font-size: 14px; font-weight: 500; }
    .step { font-size: 13px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      .surface { fill: #161b22; }
      .soft { fill: #21262d; }
      .border { stroke: #30363d; }
      .divider { stroke: #30363d; }
      .text { fill: #f0f6fc; }
      .muted { fill: #9da7b3; }
      .blue { fill: #58a6ff; }
      .blue-soft { fill: #112d4e; }
      .green { fill: #3fb950; }
      .green-soft { fill: #12261a; }
      .amber { fill: #d29922; }
      .amber-soft { fill: #342a0e; }
      .purple { fill: #bc8cff; }
      .purple-soft { fill: #2b1b3d; }
    }
  </style>

  <rect class="canvas" x="1" y="1" width="1278" height="518" rx="8"/>
  <rect class="border" x="1" y="1" width="1278" height="518" rx="8"/>

  <text class="sans eyebrow muted" x="48" y="47">FROM A ONE-OFF REQUEST TO A REUSABLE WORKFLOW</text>
  <text class="sans small muted" x="1232" y="47" text-anchor="end">Codex Skills Library</text>

  <g transform="translate(48 76)">
    <rect class="surface" width="246" height="158" rx="8"/>
    <rect class="border" width="246" height="158" rx="8"/>
    <rect class="blue-soft" x="18" y="18" width="58" height="26" rx="6"/>
    <text class="sans step blue" x="47" y="36" text-anchor="middle">TASK</text>
    <text class="sans title text" x="18" y="78">Your task</text>
    <text class="sans body muted" x="18" y="108">Research, writing, apps,</text>
    <text class="sans body muted" x="18" y="132">or technical operations</text>
  </g>

  <path class="divider" d="M304 155 H326" stroke-width="2"/>
  <path class="muted" d="M326 150 L334 155 L326 160 Z"/>

  <g transform="translate(344 76)">
    <rect class="surface" width="250" height="158" rx="8"/>
    <rect class="border" width="250" height="158" rx="8"/>
    <rect class="green-soft" x="18" y="18" width="64" height="26" rx="6"/>
    <text class="sans step green" x="50" y="36" text-anchor="middle">SKILL</text>
    <text class="mono title green" x="18" y="78">$skill-name</text>
    <text class="sans body muted" x="18" y="108">A focused workflow with</text>
    <text class="sans body muted" x="18" y="132">boundaries and outputs</text>
  </g>

  <path class="divider" d="M604 155 H626" stroke-width="2"/>
  <path class="muted" d="M626 150 L634 155 L626 160 Z"/>

  <g transform="translate(644 76)">
    <rect class="surface" width="250" height="158" rx="8"/>
    <rect class="border" width="250" height="158" rx="8"/>
    <rect class="purple-soft" x="18" y="18" width="74" height="26" rx="6"/>
    <text class="sans step purple" x="55" y="36" text-anchor="middle">CODEX</text>
    <text class="sans title text" x="18" y="78">Checks each step</text>
    <circle class="purple" cx="24" cy="104" r="4"/>
    <text class="sans small muted" x="38" y="109">inspects the context</text>
    <circle class="purple" cx="24" cy="128" r="4"/>
    <text class="sans small muted" x="38" y="133">verifies before done</text>
  </g>

  <path class="divider" d="M904 155 H926" stroke-width="2"/>
  <path class="muted" d="M926 150 L934 155 L926 160 Z"/>

  <g transform="translate(944 76)">
    <rect class="surface" width="288" height="158" rx="8"/>
    <rect class="border" width="288" height="158" rx="8"/>
    <rect class="amber-soft" x="18" y="18" width="70" height="26" rx="6"/>
    <text class="sans step amber" x="53" y="36" text-anchor="middle">RESULT</text>
    <text class="sans title text" x="18" y="78">Inspectable output</text>
    <text class="sans body muted" x="18" y="108">Plan, review, patch,</text>
    <text class="sans body muted" x="18" y="132">or verified release</text>
  </g>

  <line class="divider" x1="48" y1="266" x2="1232" y2="266"/>

  <g transform="translate(48 298)">
    <text class="sans eyebrow green" x="0" y="0">RESEARCH + PAPERS · 9</text>
    <text class="sans group-title text" x="0" y="37">Idea &#8594; evidence</text>
    <text class="sans small muted" x="0" y="65">Experiments, papers, reviews, figures</text>
  </g>

  <line class="divider" x1="340" y1="292" x2="340" y2="382"/>

  <g transform="translate(372 298)">
    <text class="sans eyebrow blue" x="0" y="0">APPS + UI · 4</text>
    <text class="sans group-title text" x="0" y="37">Feature &#8594; tested build</text>
    <text class="sans small muted" x="0" y="65">Design, implementation, debugging,</text>
    <text class="sans small muted" x="0" y="84">and packaging</text>
  </g>

  <line class="divider" x1="650" y1="292" x2="650" y2="382"/>

  <g transform="translate(682 298)">
    <text class="sans eyebrow purple" x="0" y="0">GENERAL METHODS · 2</text>
    <text class="sans group-title text" x="0" y="37">Question &#8594; decision</text>
    <text class="sans small muted" x="0" y="65">Requirements and search</text>
    <text class="sans small muted" x="0" y="84">before building</text>
  </g>

  <line class="divider" x1="964" y1="292" x2="964" y2="382"/>

  <g transform="translate(996 298)">
    <text class="sans eyebrow amber" x="0" y="0">GITHUB + CODEX · 2</text>
    <text class="sans group-title text" x="0" y="37">Publish or recover</text>
    <text class="sans small muted" x="0" y="65">Repository audits and</text>
    <text class="sans small muted" x="0" y="84">session recovery</text>
  </g>

  <rect class="soft" x="48" y="420" width="1184" height="56" rx="8"/>
  <text class="sans body text" x="78" y="454">17 installable skills</text>
  <circle class="muted" cx="278" cy="449" r="3"/>
  <text class="sans body text" x="302" y="454">copy-only installer</text>
  <circle class="muted" cx="504" cy="449" r="3"/>
  <text class="sans body text" x="528" y="454">declared requirements</text>
  <circle class="muted" cx="760" cy="449" r="3"/>
  <text class="sans body text" x="784" y="454">licenses and provenance</text>
</svg>
